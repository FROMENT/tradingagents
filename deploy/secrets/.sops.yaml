# SOPS configuration (age backend).
#
# Replace the recipient below with YOUR age PUBLIC key. Generate a keypair with:
#   age-keygen -o age.key
# The public key is printed as "Public key: age1..." — put that here. Keep the
# private key file (age.key) OFF git and off this host except at /etc/tradingagents/age.key
# (mode 0600); it is the single bootstrap secret the whole scheme reduces to.
#
# Encrypt (produces the only file that may be committed):
#   SOPS_AGE_RECIPIENTS=age1... sops --encrypt deploy/secrets/secrets.plain.env \
#       > deploy/secrets/secrets.enc.env
#
# The runtime decrypt (on the host, into tmpfs) is deploy/scripts/decrypt-secrets.sh.

creation_rules:
  - path_regex: deploy/secrets/.*\.enc\.(env|ya?ml|json)$
    age: age1REPLACE_WITH_YOUR_AGE_PUBLIC_KEY
