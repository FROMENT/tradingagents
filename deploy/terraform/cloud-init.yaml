#cloud-config
# Provisions the OCI Ampere host for the intraday stack: Docker, the OCI iptables
# fix, SOPS/age, and the directory layout. It deliberately does NOT clone the
# repo or fetch secrets — code delivery is the self-hosted CI runner (or a manual
# clone into /opt/tradingagents), and the age key is placed out of band.
package_update: true
package_upgrade: false

write_files:
  - path: /opt/install-sops.sh
    permissions: "0755"
    content: |
      #!/usr/bin/env bash
      # Install a pinned SOPS release and verify it against the release's own
      # published checksums before putting it on PATH — guards against a
      # corrupted/tampered download. For a stronger supply-chain guarantee,
      # pin the expected hash in this file instead of fetching the checksums.
      set -euo pipefail
      V=v3.9.4
      base="https://github.com/getsops/sops/releases/download/$V"
      asset="sops-$V.linux.arm64"
      tmp="$(mktemp -d)"
      curl -fsSL -o "$tmp/sops" "$base/$asset"
      curl -fsSL -o "$tmp/sums" "$base/sops-$V.checksums.txt"
      expected="$(grep " $asset\$" "$tmp/sums" | awk '{print $1}')"
      [ -n "$expected" ] || { echo "no checksum for $asset" >&2; exit 1; }
      echo "$expected  $tmp/sops" | sha256sum -c -
      install -m 0755 "$tmp/sops" /usr/local/bin/sops
      rm -rf "$tmp"
  - path: /etc/tradingagents/README
    permissions: "0644"
    content: |
      TradingAgents intraday host (P3 scaffold). Next steps:
        1. Place the repo at /opt/tradingagents (self-hosted CI runner or git clone).
        2. Put your age private key at /etc/tradingagents/age.key (chmod 0600).
        3. Ensure deploy/secrets/secrets.enc.env is committed (SOPS-encrypted).
        4. sudo cp /opt/tradingagents/deploy/systemd/tradingagents-intraday.service /etc/systemd/system/
           sudo systemctl daemon-reload && sudo systemctl enable --now tradingagents-intraday
      A self-hosted GitHub runner may ONLY be attached to a PRIVATE repo.

runcmd:
  # --- Docker Engine + compose plugin ---
  - curl -fsSL https://get.docker.com | sh
  - systemctl enable --now docker
  # --- OCI iptables fix: the stock Ubuntu image ships INPUT/FORWARD REJECT rules
  #     that break the Docker bridge. Allow the bridge, then persist. (On an
  #     Oracle Linux image the firewall is firewalld instead — adjust there.)
  - iptables -I INPUT 1 -i docker0 -j ACCEPT
  - iptables -I FORWARD 1 -i docker0 -j ACCEPT
  - iptables -I FORWARD 1 -o docker0 -j ACCEPT
  - DEBIAN_FRONTEND=noninteractive apt-get update
  - DEBIAN_FRONTEND=noninteractive apt-get install -y iptables-persistent netcat-openbsd age
  - netfilter-persistent save || true
  # --- SOPS (age backend), ARM64 — downloaded AND checksum-verified ---
  - /opt/install-sops.sh
  # --- Layout ---
  - install -d -m 0755 /opt/tradingagents
  - install -d -m 0700 /etc/tradingagents
  - usermod -aG docker ubuntu || true
